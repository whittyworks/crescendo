<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin &middot; My Holy Crescendo</title>
    <meta name="robots" content="noindex, nofollow">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Cinzel:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon32x32.png?v=2">
    <link rel="apple-touch-icon" href="/appletouchicon.png?v=2">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --cream: #FDF8F3;
            --cream-dark: #F5EFE7;
            --gold: #D4AF37;
            --gold-light: #E8C872;
            --gold-dark: #B8941F;
            --navy: #163245;
            --text-dark: #2C2416;
            --text-medium: #5C5142;
            --green: #4a7c59;
            --red: #c44569;
            --amber: #b8860b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Cormorant Garamond', Georgia, serif;
            background: var(--cream);
            color: var(--text-dark);
            line-height: 1.7;
            padding-top: 80px;
        }

        /* ── Nav ── */
        nav {
            position: fixed; top: 0; left: 0; right: 0;
            background: rgba(253,248,243,0.97);
            backdrop-filter: blur(10px);
            padding: 1rem 5%;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 1000;
            border-bottom: 1px solid rgba(212,175,55,0.2);
        }
        .nav-brand { font-family: 'Cinzel', serif; font-size: 1.1rem; color: var(--gold-dark); }
        .nav-sub { font-family: 'Montserrat', sans-serif; font-size: 0.72rem; color: var(--gold); text-transform: uppercase; letter-spacing: 2px; }
        .nav-right { display: flex; align-items: center; gap: 1.5rem; }
        .nav-right a { font-family: 'Montserrat', sans-serif; font-size: 0.75rem; color: var(--text-medium); text-decoration: none; text-transform: uppercase; letter-spacing: 1px; }
        .nav-right a:hover { color: var(--gold); }

        /* ── Page ── */
        .page-header {
            padding: 3rem 5% 2rem;
            border-bottom: 1px solid rgba(212,175,55,0.15);
        }
        .page-header h1 {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            color: var(--gold-dark);
            font-weight: 400;
            margin-bottom: 0.25rem;
        }
        .page-header p {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            color: var(--text-medium);
            letter-spacing: 1px;
        }

        /* ── Loading / Access denied ── */
        .state-msg {
            text-align: center;
            padding: 6rem 5%;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            color: var(--text-medium);
            letter-spacing: 1px;
        }

        /* ── Summary cards ── */
        .summary-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 1rem;
            padding: 2rem 5%;
            max-width: 1200px;
            margin: 0 auto;
        }
        .summary-card {
            background: white;
            border-radius: 12px;
            padding: 1.25rem 1.5rem;
            border: 1px solid rgba(212,175,55,0.15);
            box-shadow: 0 3px 12px rgba(212,175,55,0.06);
        }
        .summary-card .s-label {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.68rem;
            color: var(--text-medium);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 0.4rem;
        }
        .summary-card .s-value {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            color: var(--gold-dark);
            font-weight: 400;
        }

        /* ── Participant grid ── */
        .participants {
            padding: 0 5% 4rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 1.25rem;
        }

        .participant-card {
            background: white;
            border-radius: 12px;
            border: 1px solid rgba(212,175,55,0.15);
            box-shadow: 0 3px 12px rgba(212,175,55,0.06);
            margin-bottom: 1rem;
            overflow: hidden;
            transition: box-shadow 0.2s;
        }
        .participant-card:hover { box-shadow: 0 6px 24px rgba(212,175,55,0.12); }

        .participant-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1.25rem 1.5rem;
            cursor: pointer;
            user-select: none;
        }

        .p-avatar {
            width: 44px; height: 44px;
            background: linear-gradient(135deg, var(--gold-light), var(--gold));
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            color: white;
            flex-shrink: 0;
        }

        .p-info { flex: 1; min-width: 0; }
        .p-name-row {
            display: flex; align-items: center; gap: 0.5rem;
        }
        .p-name {
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            color: var(--text-dark);
            font-weight: 400;
        }
        .p-name.placeholder { color: var(--text-medium); font-style: italic; }
        .p-name-edit {
            background: none; border: none; cursor: pointer;
            color: var(--text-medium); font-size: 0.85rem;
            opacity: 0.5; transition: opacity 0.2s, color 0.2s;
            padding: 0.15rem 0.35rem; border-radius: 4px;
        }
        .p-name-edit:hover { opacity: 1; color: var(--gold-dark); background: rgba(212,175,55,0.08); }
        .p-name-edit-form {
            display: none; align-items: center; gap: 0.4rem; flex-wrap: wrap;
        }
        .p-name-edit-form input {
            border: 1.5px solid rgba(212,175,55,0.3); border-radius: 6px;
            padding: 0.35rem 0.7rem;
            font-family: 'Cormorant Garamond', serif; font-size: 1rem;
            color: var(--text-dark); background: var(--cream);
            min-width: 180px;
        }
        .p-name-edit-form input:focus { outline: none; border-color: var(--gold); background: white; }
        .p-name-save, .p-name-cancel {
            font-family: 'Montserrat', sans-serif; font-size: 0.65rem;
            letter-spacing: 1.5px; text-transform: uppercase;
            padding: 0.4rem 0.85rem; border-radius: 50px; border: none; cursor: pointer;
        }
        .p-name-save { background: linear-gradient(135deg, var(--gold-light), var(--gold)); color: white; }
        .p-name-save[disabled] { opacity: 0.5; cursor: not-allowed; }
        .p-name-cancel { background: transparent; color: var(--text-medium); border: 1px solid rgba(212,175,55,0.25); }
        .p-name-cancel:hover { border-color: var(--gold); color: var(--gold-dark); }
        .p-email {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.72rem;
            color: var(--text-medium);
            letter-spacing: 0.5px;
        }

        .p-status {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .status-pill {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 0.3rem 0.75rem;
            border-radius: 50px;
        }
        .status-pill.complete { background: rgba(74,124,89,0.1); color: var(--green); }
        .status-pill.partial  { background: rgba(184,134,11,0.1); color: var(--amber); }
        .status-pill.empty    { background: rgba(196,69,105,0.1); color: var(--red); }

        .p-chevron {
            font-size: 0.8rem;
            color: var(--gold);
            transition: transform 0.3s;
            flex-shrink: 0;
        }
        .participant-card.open .p-chevron { transform: rotate(180deg); }

        /* ── Detail panel ── */
        .participant-detail {
            display: none;
            border-top: 1px solid rgba(212,175,55,0.15);
            padding: 1.5rem;
        }
        .participant-card.open .participant-detail { display: block; }

        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 768px) { .detail-grid { grid-template-columns: 1fr; } }

        .detail-section h4 {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--gold);
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(212,175,55,0.2);
        }

        .detail-row {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 0.6rem;
            align-items: baseline;
        }
        .detail-key {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.68rem;
            color: var(--text-medium);
            text-transform: uppercase;
            letter-spacing: 1px;
            min-width: 120px;
            flex-shrink: 0;
        }
        .detail-val {
            font-size: 1rem;
            color: var(--text-dark);
            cursor: pointer;
            border-bottom: 1px dashed transparent;
            transition: border-color 0.15s, color 0.15s;
            flex: 1;
        }
        .detail-val:hover {
            border-bottom-color: rgba(212,175,55,0.4);
            color: var(--gold-dark);
        }
        .detail-val.empty {
            font-style: italic;
            color: rgba(92,81,66,0.4);
            font-size: 0.85rem;
        }
        .detail-val.empty:hover { color: var(--gold-dark); }
        .detail-edit { display: flex; gap: 0.5rem; align-items: center; flex: 1; }
        .detail-edit input[type="text"] {
            flex: 1;
            border: none;
            border-bottom: 1px solid var(--gold);
            background: rgba(212,175,55,0.06);
            font-family: 'Cormorant Garamond', serif;
            font-size: 1rem;
            color: var(--text-dark);
            padding: 4px 6px;
            outline: none;
        }
        .detail-edit button {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 5px 12px;
            border: 1px solid rgba(212,175,55,0.4);
            background: transparent;
            cursor: pointer;
            border-radius: 3px;
        }
        .detail-edit .edit-save {
            background: var(--gold);
            color: white;
            border-color: var(--gold);
        }
        .detail-edit .edit-save:hover { background: var(--gold-dark); }
        .detail-edit .edit-cancel:hover { background: rgba(0,0,0,0.04); }

        /* journal entries truncated */
        .journal-entry {
            margin-bottom: 1rem;
            padding: 0.75rem 1rem;
            background: var(--cream);
            border-radius: 8px;
            border-left: 3px solid rgba(212,175,55,0.3);
        }
        .journal-entry .j-label {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--gold);
            margin-bottom: 0.25rem;
        }
        .journal-entry .j-text {
            font-size: 0.95rem;
            color: var(--text-medium);
            line-height: 1.6;
        }
        .journal-entry .j-text.empty {
            font-style: italic;
            color: rgba(92,81,66,0.35);
        }

        /* ── Opus helper ── */
        .opus-panel {
            margin-top: 1.5rem;
            padding: 1.25rem 1.5rem;
            background: linear-gradient(135deg, #FDF8F3, #F5EFE7);
            border: 1px solid rgba(212,175,55,0.25);
            border-radius: 8px;
        }
        .opus-panel h4 {
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            color: var(--gold-dark);
            font-weight: 400;
            margin-bottom: 0.75rem;
        }
        .opus-summary {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            line-height: 1.9;
            color: var(--text-medium);
        }
        .opus-summary strong { color: var(--text-dark); }

        .copy-btn {
            margin-top: 0.75rem;
            display: inline-block;
            background: var(--gold);
            color: white;
            border: none;
            padding: 0.5rem 1.25rem;
            border-radius: 50px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s;
        }
        .copy-btn:hover { background: var(--gold-dark); }
        .copy-btn.copied { background: var(--green); }
    </style>
</head>
<body>

<nav>
    <div>
        <div class="nav-brand">My Holy Crescendo</div>
        <div class="nav-sub">Admin Dashboard</div>
    </div>
    <div class="nav-right">
        <a href="portal.html">&larr; Portal</a>
        <a href="#" onclick="signOut()">Sign Out</a>
    </div>
</nav>

<div id="access-denied" class="state-msg" style="display:none;">
    Access denied. This page is only available to administrators.
</div>

<div id="loading-msg" class="state-msg">
    Loading participant data&hellip;
</div>

<div id="dashboard" style="display:none;">

    <div class="page-header">
        <h1>Participant Dashboard</h1>
        <p id="last-updated"></p>
    </div>

    <div class="summary-bar" id="summary-bar"></div>

    <div class="participants">
        <p class="section-title">All Participants</p>
        <div id="participant-list"></div>
    </div>

</div>

<script>
    const SUPABASE_URL = 'https://whpxmygwxdwktnwpzqkt.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_5WOVS7lAtfbdccptcZeB3g_A3k2U6km';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const ADMIN_EMAIL = 'bea@myholycrescendo.com';
    const ADMIN_EMAIL_ALT = 'bea.whitmarsh@gmail.com';

    // Profile field labels for display
    const PROFILE_LABELS = {
        p_name_given:        'Given Name',
        p_name_lived:        'Name She Lives Under',
        p_name_confirmation: 'Confirmation Name',
        p_name_lord:         'Name from the Father',
        p_identity:          'Identity in Christ',
        p_anchor_verse:      'Anchor Verse',
        p_color_season:      'Color Season',
        p_style_essence:     'Style Essence',
        p_silhouette:        'Silhouette',
        p_love_primary:      'Primary Love Language (Receiving)',
        p_love_secondary:    'Secondary Love Language (Receiving)',
        p_love_give1:        'How You Give Love (Primary)',
        p_love_give2:        'How You Give Love (Secondary)',
        p_love_orientation:  'Love Orientation',
        p_temperament:       'Temperament',
        p_type:              'Personality Type',
        p_str1: 'Gift of Grace 1', p_str2: 'Gift of Grace 2', p_str3: 'Gift of Grace 3',
        p_str4: 'Gift of Grace 4', p_str5: 'Gift of Grace 5',
        p_vir1: 'Virtue 1',  p_vir2: 'Virtue 2',  p_vir3: 'Virtue 3',
        p_vir4: 'Virtue 4',  p_vir5: 'Virtue 5',
        p_char1: 'Charism 1', p_char2: 'Charism 2', p_char3: 'Charism 3',
        p_music1: 'Sounds That Move Her 1',
        p_music2: 'Sounds That Move Her 2',
        p_music3: 'Sounds That Move Her 3',
    };

    const JOURNAL_LABELS = {
        j_s1q1: 'S1 Q1', j_s1q2: 'S1 Q2',
        j_s2q1: 'S2 Q1', j_s2q2: 'S2 Q2',
        j_s3q1: 'S3 Q1',
        j_s4q1: 'S4 Q1', j_s5q1: 'S5 Q1', j_s6q1: 'S6 Q1',
        j_s7q1: 'S7 Q1', j_s8q1: 'S8 Q1', j_s9q1: 'S9 Q1',
        j_s10q1: 'S10 Q1', j_s10q2: 'S10 Q2',
        j_s11q1: 'S11 Q1', j_s11q2: 'S11 Q2',
        j_s12q1: 'S12 Q1', j_s12q2: 'S12 Q2',
        j_syn1: 'Synthesis 1', j_syn2: 'Synthesis 2', j_syn3: 'Synthesis 3',
        j_syn4: 'Synthesis 4', j_syn5: 'Synthesis 5',
        j_syn6: 'Synthesis 6', j_syn7: 'Synthesis 7',
        j_word1: 'Word: Who I Was',
        j_word2: 'Word: This Journey',
        j_word3: 'Word: Who I\'m Becoming',
    };

    // ── Auth check ────────────────────────────────────────────
    sb.auth.getSession().then(async ({ data: { session } }) => {
        document.getElementById('loading-msg').style.display = 'none';

        if (!session) {
            window.location.href = 'portal.html';
            return;
        }

        const email = session.user.email;
        if (email !== ADMIN_EMAIL && email !== ADMIN_EMAIL_ALT) {
            document.getElementById('access-denied').style.display = 'block';
            return;
        }

        document.getElementById('dashboard').style.display = 'block';
        await loadDashboard();
    });

    sb.auth.onAuthStateChange((event, session) => {
        if (event === 'SIGNED_OUT') window.location.href = 'portal.html';
    });

    // ── Load all data ─────────────────────────────────────────
    async function loadDashboard() {
        try {
            // Run user_results query and the admin auth-users fetch in parallel.
            const [resultsRes, authUsers] = await Promise.all([
                sb.from('user_results').select('user_id, email, assessment, result_data'),
                fetchAuthUsers()
            ]);

            if (resultsRes.error) throw resultsRes.error;
            const results = resultsRes.data || [];

            // Group results by user_id
            const byUser = {};
            results.forEach(row => {
                if (!byUser[row.user_id]) {
                    byUser[row.user_id] = {
                        email: row.email || null,
                        full_name: '',
                        last_sign_in_at: null,
                        profile: null,
                        journal: null,
                        score: null
                    };
                }
                if (row.email) byUser[row.user_id].email = row.email;
                if (row.assessment === 'symphony_profile') byUser[row.user_id].profile = row.result_data;
                if (row.assessment === 'reflection_journal') byUser[row.user_id].journal = row.result_data;
                if (row.assessment === 'symphony_score') byUser[row.user_id].score = row.result_data;
            });

            // Merge auth user data (full_name, last sign-in). Includes users
            // who may have signed up but never saved a profile yet.
            if (Array.isArray(authUsers)) {
                for (const u of authUsers) {
                    if (!byUser[u.id]) {
                        byUser[u.id] = { email: u.email || null, full_name: '', last_sign_in_at: null, profile: null, journal: null, score: null };
                    }
                    byUser[u.id].full_name = u.full_name || '';
                    byUser[u.id].last_sign_in_at = u.last_sign_in_at || null;
                    if (!byUser[u.id].email && u.email) byUser[u.id].email = u.email;
                }
            }

            renderDashboard(byUser);

        } catch(e) {
            console.error(e);
            document.getElementById('participant-list').innerHTML =
                '<p style="color:var(--red);font-family:Montserrat,sans-serif;font-size:0.85rem;">Error loading data: ' + e.message + '</p>';
        }
    }

    // Fetch auth users (for full_name + last_sign_in) via Netlify Function.
    // Returns null silently if the function isn't deployed yet — admin still works,
    // just falls back to email-prefix names.
    async function fetchAuthUsers() {
        try {
            const { data: { session } } = await sb.auth.getSession();
            if (!session) return null;
            const res = await fetch('/.netlify/functions/admin-users', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + session.access_token,
                },
                body: JSON.stringify({ action: 'list' }),
            });
            if (!res.ok) {
                console.warn('admin-users list failed:', res.status, await res.text().catch(() => ''));
                return null;
            }
            const data = await res.json();
            return data.users || [];
        } catch (e) {
            console.warn('admin-users list error:', e);
            return null;
        }
    }

    // ── Render ────────────────────────────────────────────────
    function renderDashboard(byUser) {
        window.adminProfiles = byUser;
        const userIds = Object.keys(byUser);
        const now = new Date().toLocaleString('en-US', { month:'long', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit' });
        document.getElementById('last-updated').textContent = 'Last refreshed ' + now;

        // Summary
        let profileComplete = 0, profilePartial = 0, profileEmpty = 0;
        userIds.forEach(uid => {
            const p = byUser[uid].profile;
            const filled = p ? Object.values(p).filter(v => v && v.trim && v.trim() !== '').length : 0;
            const total = Object.keys(PROFILE_LABELS).length;
            if (filled === 0) profileEmpty++;
            else if (filled >= total * 0.7) profileComplete++;
            else profilePartial++;
        });

        document.getElementById('summary-bar').innerHTML = `
            <div class="summary-card"><div class="s-label">Total Participants</div><div class="s-value">${userIds.length}</div></div>
            <div class="summary-card"><div class="s-label">Profile Complete</div><div class="s-value" style="color:var(--green)">${profileComplete}</div></div>
            <div class="summary-card"><div class="s-label">Profile Partial</div><div class="s-value" style="color:var(--amber)">${profilePartial}</div></div>
            <div class="summary-card"><div class="s-label">Profile Empty</div><div class="s-value" style="color:var(--red)">${profileEmpty}</div></div>
        `;

        // Participant cards
        const list = document.getElementById('participant-list');
        list.innerHTML = '';

        userIds.forEach((uid, idx) => {
            const email = byUser[uid].email || uid.substring(0, 12) + '...';
            const fullName = (byUser[uid].full_name || '').trim();
            const emailPrefix = (email || '').split('@')[0];
            // Real name if we have it; otherwise fall back to email prefix for display only.
            const displayName = fullName || emailPrefix;
            const initial = (displayName || '?').charAt(0).toUpperCase();
            // For the score-generation flow we still pass a name into renderDetail —
            // pass the actual full name when present, falling back to email prefix.
            const nameForScore = fullName || emailPrefix;
            const profile = byUser[uid].profile || {};
            const journal = byUser[uid].journal || {};

            const profFilled = Object.values(profile).filter(v => v && v.trim && v.trim() !== '').length;
            const profTotal = Object.keys(PROFILE_LABELS).length;
            const profPct = profTotal > 0 ? Math.round((profFilled / profTotal) * 100) : 0;

            let statusClass = 'empty', statusLabel = 'No data';
            if (profFilled >= profTotal * 0.7) { statusClass = 'complete'; statusLabel = 'Profile complete'; }
            else if (profFilled > 0) { statusClass = 'partial'; statusLabel = profPct + '% complete'; }

        window.musicBriefs[uid] = brief;

            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function escapeAttr(s) {
        return String(s == null ? '' : s)

    async function saveDisplayName(uid) {
        const input = document.getElementById('p-name-input-' + uid);
        const newName = input.value.trim();
        const saveBtn = document.getElementById('p-name-save-' + uid);

        const { data: { session } } = await sb.auth.getSession();
        if (!session) { alert('Session expired. Please sign in again.'); return; }

        saveBtn.disabled = true;
        saveBtn.textContent = 'Saving…';

        try {
            const res = await fetch('/.netlify/functions/admin-users', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + session.access_token,
                },
                body: JSON.stringify({ action: 'update_name', user_id: uid, full_name: newName }),
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || ('Save failed (' + res.status + ').'));

            const savedName = (data.user && data.user.full_name) || '';
            const email = (data.user && data.user.email) || '';
            const display = savedName || (email.split('@')[0] || '');

            // Update local cache so re-renders are correct.
            if (window.adminProfiles && window.adminProfiles[uid]) {
                window.adminProfiles[uid].full_name = savedName;
            }
            // Update the visible name + avatar initial, no full re-render needed.
            const nameEl = document.getElementById('p-name-' + uid);
            nameEl.textContent = display;
            nameEl.classList.toggle('placeholder', !savedName);
            const card = nameEl.closest('.participant-card');
            const avatar = card && card.querySelector('.p-avatar');
            if (avatar) avatar.textContent = (display || '?').charAt(0).toUpperCase();

            cancelEditName(uid);
        } catch (e) {
            alert('Could not save name: ' + e.message);
        } finally {
            saveBtn.disabled = false;
            saveBtn.textContent = 'Save';
        }
    }

        const profile = userData && userData.profile ? userData.profile : {};

        const requestBody = {
            model: 'claude-haiku-4-5-20251001',
            max_tokens: 6000,
            system: SCORE_SYSTEM_PROMPT,
            messages: [{ role: 'user', content: buildScorePrompt(profile) }]
        };

        try {
            const response = await fetch('/api/claude-stream', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestBody)
            });

            // If we got a JSON error response (non-stream), surface it
            if (!response.ok) {
                let errMsg = 'HTTP ' + response.status;
                try {
                    const errBody = await response.text();
                    try {
                        const parsed = JSON.parse(errBody);
                        errMsg = parsed?.error?.message || parsed?.error || errBody;
                    } catch { errMsg = errBody || errMsg; }
                } catch {}
                throw new Error(errMsg);
            }

            // Read SSE stream from Anthropic
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            let fullText = '';

            while (true) {
                const { value, done } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop(); // keep last incomplete line for next chunk

                for (const line of lines) {
                    if (!line.startsWith('data: ')) continue;
                    const dataStr = line.slice(6).trim();
                    if (!dataStr) continue;
                    try {
                        const evt = JSON.parse(dataStr);
                        if (evt.type === 'content_block_delta' && evt.delta && evt.delta.type === 'text_delta') {
                            fullText += evt.delta.text;
                            // Filter the brief delimiter and everything after it from the live display
                            const briefStart = fullText.indexOf('<<<MUSIC_BRIEF>>>');
                            streamDiv.textContent = briefStart >= 0 ? fullText.slice(0, briefStart).trim() : fullText;
                            output.scrollTop = output.scrollHeight;
                        } else if (evt.type === 'error') {
                            throw new Error(evt.error?.message || 'Stream error');
                        }
                    } catch (e) {
                        if (e.message && e.message !== 'Stream error') {
                            if (e.message.startsWith('Stream error') || e.message.includes('error')) throw e;
                        }
                    }
                }
            }

            if (!fullText) throw new Error('No content received');

            // Split score from music brief
            let scoreText = fullText;
            let musicBrief = '';
            const briefMatch = fullText.match(/<<<MUSIC_BRIEF>>>([\s\S]*?)<<<END>>>/);
            if (briefMatch) {
                musicBrief = briefMatch[1].trim();
                scoreText = fullText.replace(/<<<MUSIC_BRIEF>>>[\s\S]*?<<<END>>>/, '').trim();
            }

            window.scoreTexts[uid] = scoreText;
            window.musicBriefs[uid] = musicBrief;

            renderScoreOutput(output, scoreText);
            if (musicBrief && briefPanel && briefTextEl) {
                briefTextEl.textContent = musicBrief;
                briefPanel.style.display = 'block';
            }

            copyRow.style.display = 'flex';
            btn.textContent = 'Regenerate Score';
            btn.disabled = false;
        } catch(e) {
            console.error('[Score Gen] Error:', e);
            output.innerHTML = '<div class="score-loading" style="color:#c44569;">Error: ' + e.message + '</div>';
            btn.textContent = 'Try Again';
            btn.disabled = false;
        }
    }

    function renderScoreOutput(container, text) {
        // Find every occurrence of every section heading in the text.
        // Each entry: { key, label, start, end, contentStart }
        const allHeadings = [];
        SCORE_SECTIONS.forEach(s => {
            const re = new RegExp('^' + s.key + '\\s*$', 'gmi');
            let m;
            while ((m = re.exec(text)) !== null) {
                allHeadings.push({
                    key: s.key,
                    label: s.label,
                    start: m.index,
                    contentStart: m.index + m[0].length
                });
            }
        });
        // Sort by position so we know what each section's content extends to
        allHeadings.sort((a, b) => a.start - b.start);

        // For each heading, content runs until the next heading (any heading)
        for (let i = 0; i < allHeadings.length; i++) {
            const next = allHeadings[i + 1];
            allHeadings[i].content = text.slice(
                allHeadings[i].contentStart,
                next ? next.start : text.length
            ).trim();
        }

        // Pick FIRST occurrence of each canonical section, render in canonical order
        const seen = new Set();
        const sectionsToRender = [];
        SCORE_SECTIONS.forEach(s => {
            const found = allHeadings.find(h => h.key === s.key && !seen.has(h.key));
            if (found && found.content) {
                seen.add(s.key);
                sectionsToRender.push({ label: s.label, content: found.content });
            }
        });

        let html = '';
        sectionsToRender.forEach(sec => {
            html += '<div class="score-section-title">' + sec.label + '</div>';
            sec.content.split(/\n\n+/).map(p=>p.trim()).filter(Boolean).forEach(para => {
                html += '<p class="score-para">' + para + '</p>';
            });
        });

        container.innerHTML = html || '<p class="score-para">' + text + '</p>';
    }

    function copyScore(uid) {
        const text = window.scoreTexts[uid] || '';
        const btn = document.getElementById('copy-score-btn-' + uid);
        navigator.clipboard.writeText(text).then(() => {
            btn.textContent = 'Copied!';
            btn.classList.add('copied');
            setTimeout(() => { btn.textContent = 'Copy Score Text'; btn.classList.remove('copied'); }, 2000);
        });
    }

    function copyMusicBrief(uid) {
        const text = window.musicBriefs && window.musicBriefs[uid] ? window.musicBriefs[uid] : '';
        if (!text) return;
        const btn = document.getElementById('copy-brief-btn-' + uid);
        navigator.clipboard.writeText(text).then(() => {
            btn.textContent = 'Copied!';
            btn.classList.add('copied');

    // ── Inline edit for participant profile fields ──────────────
    // Lets admin click any value in the detail panel, edit it, save back
    // to Supabase. Used to fix swapped fields, typos, etc.
    function startEditField(uid, key) {
        // Close any other open edits in this card so only one is editing at a time
        document.querySelectorAll('.detail-edit').forEach(el => {
            const id = el.id;
            if (id !== 'edit-' + uid + '-' + key) {
                el.style.display = 'none';
                const valId = id.replace('edit-', 'val-');
                const valEl = document.getElementById(valId);
                if (valEl) valEl.style.display = '';
            }
        });
        document.getElementById('val-' + uid + '-' + key).style.display = 'none';
        const editEl = document.getElementById('edit-' + uid + '-' + key);
        editEl.style.display = 'flex';
        const input = document.getElementById('input-' + uid + '-' + key);
        input.focus();
        input.select();
    }

    function cancelFieldEdit(uid, key) {
        document.getElementById('edit-' + uid + '-' + key).style.display = 'none';
        document.getElementById('val-' + uid + '-' + key).style.display = '';
    }

    function onEditFieldKey(e, uid, key) {
        if (e.key === 'Enter') { e.preventDefault(); saveFieldEdit(uid, key); }
        else if (e.key === 'Escape') { e.preventDefault(); cancelFieldEdit(uid, key); }
    }

    async function saveFieldEdit(uid, key) {
        const input = document.getElementById('input-' + uid + '-' + key);
        const newVal = input.value;
        const userData = window.adminProfiles[uid];
        if (!userData) return;
        const profile = userData.profile || {};

        // Build the updated profile object
        const updated = Object.assign({}, profile, { [key]: newVal });

        try {
            const { error } = await sb.from('user_results').upsert(
                { user_id: uid, assessment: 'symphony_profile', result_data: updated, updated_at: new Date().toISOString() },
                { onConflict: 'user_id,assessment' }
            );
            if (error) throw error;

            // Update in-memory cache
            userData.profile = updated;

            // Update the visible value
            const valEl = document.getElementById('val-' + uid + '-' + key);
            const trimmed = (newVal || '').trim();
            if (trimmed) {
                valEl.textContent = trimmed;
                valEl.classList.remove('empty');
            } else {
                valEl.innerHTML = '&mdash; not filled in';
                valEl.classList.add('empty');
            }
            cancelFieldEdit(uid, key);
        } catch(e) {
            alert('Could not save: ' + e.message);
        }
    }

    // ── Save score to participant profile ────────────────────
    async function saveScoreForParticipant(uid, name) {
        const btn = document.getElementById('save-score-btn-' + uid);
        const badge = document.getElementById('save-score-badge-' + uid);
        const text = window.scoreTexts && window.scoreTexts[uid];
        const brief = (window.musicBriefs && window.musicBriefs[uid]) || '';
        if (!text) return;
        btn.disabled = true;
        btn.textContent = 'Saving…';
        try {
            const { error } = await sb.from('user_results').upsert(
                { user_id: uid, assessment: 'symphony_score', result_data: { text: text, music_brief: brief }, updated_at: new Date().toISOString() },
                { onConflict: 'user_id,assessment' }
            );
            if (error) throw error;
            btn.textContent = '✓ Saved';
            if (badge) badge.style.display = 'inline-block';
        } catch(e) {
            btn.textContent = 'Save failed';
            btn.disabled = false;
            alert('Could not save score for ' + name + ': ' + e.message);
        }
    }

    // ── Print score as beautiful PDF ─────────────────────────
    function printScore(uid, name) {

        if (!text) return;

        const userData = window.adminProfiles[uid];
        const profile = userData && userData.profile ? userData.profile : {};
        const nameLord = (profile.p_name_lord || name || 'Beloved').trim();

        const SECTIONS = [
            { key: 'DAUGHTER',   label: 'DAUGHTER',        num: 'I' },
            { key: 'INSTRUMENT', label: 'THE INSTRUMENT',  num: 'II' },
            { key: 'MOVEMENTS',  label: 'THE MOVEMENTS',   num: 'III' },
            { key: 'THEME',      label: 'THE THEME',       num: 'IV' },
            { key: 'SYMPHONY',   label: 'YOUR SYMPHONY',   num: 'V' },
            { key: 'SEND',       label: 'GO AND LIVE IT',  num: 'VI' },
        ];

        let sectionsHtml = '';
        for (let i = 0; i < SECTIONS.length; i++) {
            const s = SECTIONS[i];
            const regex = new RegExp('^' + s.key + '\\s*$', 'mi');
            const match = regex.exec(text);
            if (!match) continue;
            let sectionText = text.slice(match.index + match[0].length).trim();
            const nextKeys = SECTIONS.slice(i+1).map(x=>x.key);
            if (nextKeys.length) {
                const endPattern = new RegExp('^(' + nextKeys.map(k=>k.replace(/[.*+?^${}()|[\\]\\]/g,'\\$&')).join('|') + ')\\s*$','mi');
                const endMatch = endPattern.exec(sectionText);
                if (endMatch) sectionText = sectionText.slice(0, endMatch.index).trim();
            }
            const paras = sectionText.split(/\n\n+/).map(p=>p.trim()).filter(Boolean)
                .map(p => '<p>' + p + '</p>').join('');

            if (i > 0) sectionsHtml += '<div class="divider"></div>';
            sectionsHtml += `

                    <div class="section-header">
                        <span class="section-num">${s.num}</span>
